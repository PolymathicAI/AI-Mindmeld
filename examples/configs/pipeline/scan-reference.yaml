# The own-state reference: the receiver's own captured name state written at one layer at a time, Yes/No scored on
# the scan items (latent_interconnect.run.scan). No encoder; every field but the written states is study.yaml's.
destination: mine/qwen/scan-reference
scan:
  receiver: {$ref: qwen2.5-0.5b-instruct.yaml}
  domain: {name: protein, data: {$pin: mine/protein-domain}}
  source: oracle
  states: {$pin: mine/qwen/capture}
  item_set: {$pin: mine/items-scan}
  tasks: [DNA-binding, Membrane, Transferase, Mammalia]
  frame: a5
  slot: x
  answers: {"yes": "Yes", "no": "No"}  # quoted keys: YAML 1.1 reads bare yes/no as booleans; one token each
  layers: [0, 4, 8, 12, 16, 20]
  alpha: 1.0
  layers_per_call: 6
device_class: cpu
