placeholder: " X"
layers_path: model.layers
template_kwargs:
  thinking: {"on": {thinking: true}, "off": {thinking: false}}   # quoted: bare on/off are booleans; default ON
trust_remote_code: true
thinking_close: "</think>"   # closes the thinking block: the target part between a scaffold and the answer
backends:
  score: kimi-stream
  capture: kimi-stream
  train: kimi-ep
  generate: kimi-vllm
