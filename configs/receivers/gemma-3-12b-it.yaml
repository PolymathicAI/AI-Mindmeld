# Gemma 3 12B instruct, revision pinned at download. Layer L =
# hidden_states[L]: for L < 48 the input of decoder layer L, where a write at L applies; L = 48 the final normed output
# (captures only). AutoModelForCausalLM loads it as Gemma3ForConditionalGeneration (vision tower included, transformers
# 4.57.6): hf reads the text decoder get_decoder() names (model.language_model, a Gemma3TextModel) and its text config's
# width. Weights bf16; no logit softcapping; sliding-window layers (1,024 tokens) 5 to 1 global. Generation ends on id 1
# (<eos>) or 106 (<end_of_turn>), the model's generation_config.json. No thinking mode: its chat template takes no
# thinking argument and folds a system message into the first user turn, so it has no thinking close; a trace is cut at
# its end id. The placeholder " X" is id 1684.
name: gemma-3-12b-it
model_id: google/gemma-3-12b-it
revision: 96b6f1eccf38110c56df3a15bffe176da04bfd80
depth: 48
d_model: 3840
placeholder: " X"
layers_path: model.language_model.layers
backends: {score: hf, train: hf, generate: hf, capture: hf}
template_kwargs: {thinking: {"on": {}, "off": {}}}   # the template takes no thinking argument: thinking_request asks
# appended to the last user message in thinking mode
thinking_request: "Reason first; give the answer only at the end."
separator: "\n\n"   # the scaffold close; the trace close before "Answer:" (an after-trace prefill's {close})
