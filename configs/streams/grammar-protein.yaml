coverage_sample: 2000
coverage_seed: 99
disabled:
  "describe:this_protein": "coverage 0.485-0.501 on train proteins: borderline to the 0.5 rule; fixed off so the enabled set\
    \ does not depend on the coverage sample"
  "function:this_protein": coverage 0.491-0.499; as describe
  "describe:two_sentences": "GPU answerability, vet_prompt_formats --formats: instruction makes the answer likelier in 0.567\
    \ of 30 prompts < 0.6"
  "pathway:two_sentences": "answerability 0.533, median gain 0.38 nats: pathway fields are mostly one sentence, so the format\
    \ equals the verbatim text"
  "location:loc_sentence": answerability 0.567, median gain 0.30 nats
  "describe:bullets": "rechecked: instruction helps 0.567 of 30 prompts, median gain 0.56 nats < the 0.6 bar"
  "function:bullets": "rechecked: 0.533 of 30, median 1.58"
  "subunit:two_sentences": "rechecked: 0.567 of 30, median 0.53"
