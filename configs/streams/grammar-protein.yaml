# The original protein runs' prompt grammar with its target wording (data.grammar.GrammarSpec): converted from the
# original runs' prompt grammar and target wording (at rate 0.5) by these rules:
# - training entries only: the last entry of every pool and instruction list of two or more entries is the original's
#   held-out entry (its unseen-wording evaluation) and is dropped; seps has none;
# - <SLOT> -> <SLOT:x>;
# - the subunit core_rewrites applied (never to a held-out entry); partner_cores lists the training subunit cores whose
#   core_intent is "partners"; template_rewrites and partner_templates from the wording's subunit block;
# - source_cores, source_example_questions, format_example_questions, announce_uniprot, flag_tasks (flag_qtypes),
#   fit_cap_formats and pathway_sentence_max_parts from the wording; extra_formats (pathway_sentence) merged;
# - formats: per task, every answer format of its group that the task allows (the original engine's table of
#   allowed formats), with its training instructions; a format is enabled when it applies to at least
#   min_coverage of the training texts of the task's field (a sample of coverage_sample texts, seed coverage_seed; the
#   original fit_coverage rule) and is not in `disabled` (the grammar's and the target wording's disabled_formats, each
#   with its measured reason); `none` always;
# - reject: the original protein runs' held-out templates (a training draw that reproduces one is redrawn).
rate: 0.5
system_roles:
- null
- You are a protein biology assistant. Proteins are given to you as a single embedding token in place of their name.
- Each protein in this conversation is represented by one embedding token instead of its name. Treat the token as that protein.
- You answer questions about proteins that are given as embeddings rather than names.
- Protein annotation assistant. The protein in each query is given as an embedding token.
- You are an expert in protein function. The user refers to proteins by embedding tokens, not by name.
- You are a helpful assistant for molecular biology. Proteins appear as embedding tokens rather than names.
- Proteins are written here as embedding tokens. Each token stands for one specific protein.
- You are a biochemistry tutor. The student refers to each protein by an embedding token instead of a name.
- Assistant for protein questions. An embedding token takes the place of each protein's name.
- You work with protein embeddings. When the user shows an embedding token, answer about the protein it represents.
