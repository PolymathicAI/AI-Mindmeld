# The paper molecule runs' Yes/No stream (data.qa_streams.YesNoParams): the 12 train Yes/No frames and the 24
# trained ChEBI classes' questions (two each, yesno_properties) of the original molecule runs' templates,
# the class balance (the original keyword balance) with cluster_sqrt objects, the answers Yes / No, the
# single_token curve of the original molecule loss weights, the molecule scaffold (scaffold-molecule.yaml), in-context
# examples and grammar. Keys of `questions` are molecule-domain-band-split's trained Yes/No task ids (the evaluation
# item table's trained_yesno tasks, key @class:<ChEBI id>).
templates:
- id: yn_01
  user: Consider the compound<SLOT:x>. {question} Answer with Yes or No.
- id: yn_02
  user: "<SLOT:x>\n{question} (Yes/No)"
- id: yn_03
  user: "Compound:<SLOT:x>\nQuestion: {question}\nAnswer (Yes or No):"
- id: yn_04
  user: "About the compound<SLOT:x>: {question} Reply with a single word, Yes or No."
- id: yn_05
  user: "Quick yes-or-no question about<SLOT:x>: {question}"
- id: yn_06
  user: "{question} The compound in question is<SLOT:x>. Answer Yes or No."
- id: yn_07
  user: I'm sorting a list of compounds into categories for a review article. The current one is<SLOT:x>.
    {question} Please answer only Yes or No.
- id: yn_08
  user: "Given the embedding<SLOT:x>, answer Yes or No: {question}"
- id: yn_09
  user: Answer Yes or No. {question} Compound:<SLOT:x>
- id: yn_10
  user: For the compound represented by<SLOT:x>, answer the following with Yes or No. {question}
- id: yn_11
  user: Embedding:<SLOT:x>. {question} Respond Yes or No.
- id: yn_12
  user: A compound is given as<SLOT:x>. {question} Yes or no?
questions:
  hydroxides:
  - Is it a hydroxide?
  - Does it belong to the class of hydroxides?
  heterocyclic compound:
  - Is it a heterocyclic compound?
  - Does it belong to the class of heterocyclic compounds?
  lipid:
  - Is it a lipid?
  - Does it belong to the class of lipids?
  organonitrogen heterocyclic compound:
  - Is it an organonitrogen heterocyclic compound?
  - Does it belong to the class of organonitrogen heterocyclic compounds?
  carbohydrates and carbohydrate derivatives:
  - Is it a carbohydrate or a carbohydrate derivative?
  - Does it belong to the class of carbohydrates and carbohydrate derivatives?
  heteropolycyclic compound:
  - Is it a heteropolycyclic compound?
  - Does it belong to the class of heteropolycyclic compounds?
  ester:
  - Is it an ester?
  - Does it belong to the class of esters?
  monocyclic compound:
  - Is it a monocyclic compound?
  - Does it belong to the class of monocyclic compounds?
  ether:
  - Is it an ether?
  - Does it belong to the class of ethers?
  alcohol:
  - Is it an alcohol?
  - Does it belong to the class of alcohols?
  benzenoid aromatic compound:
  - Is it a benzenoid aromatic compound?
  - Does it belong to the class of benzenoid aromatic compounds?
  ketone:
  - Is it a ketone?
  - Does it belong to the class of ketones?
  organic polycyclic compound:
  - Is it an organic polycyclic compound?
  - Does it belong to the class of organic polycyclic compounds?
  amino oligosaccharide:
  - Is it an amino oligosaccharide?
  - Does it belong to the class of amino oligosaccharides?
  salt:
  - Is it a salt?
  - Does it belong to the class of salts?
  organic tricyclic compound:
  - Is it an organic tricyclic compound?
  - Does it belong to the class of organic tricyclic compounds?
  lactone:
  - Is it a lactone?
  - Does it belong to the class of lactones?
  flavonoids:
  - Is it a flavonoid?
  - Does it belong to the class of flavonoids?
  steroid:
  - Is it a steroid?
  - Does it belong to the class of steroids?
  carbopolycyclic compound:
  - Is it a carbopolycyclic compound?
  - Does it belong to the class of carbopolycyclic compounds?
  peptide:
  - Is it a peptide?
  - Does it belong to the class of peptides?
  organic fundamental parent:
  - Is it an organic fundamental parent?
  - Does it belong to the class of organic fundamental parents?
  sulfur oxoacid derivative:
  - Is it a sulfur oxoacid derivative?
  - Does it belong to the class of sulfur oxoacid derivatives?
  chlorobenzenes:
  - Is it a chlorobenzene?
  - Does it belong to the class of chlorobenzenes?
sampling: cluster_sqrt
answers:
  "yes": "Yes"
  "no": "No"
weights:
  family: single_token
  floor: 0.1
scaffold: {$ref: scaffold-molecule.yaml}
context: {$ref: context-molecule.yaml}
grammar: {$ref: grammar-molecule.yaml}
