  pathway: {family: power, floor: 0.1, tau: 0.001, p: 1.608}
  category: {family: power, floor: 0.1, tau: 0.001, p: 1.608}
  step: {family: power, floor: 0.1, tau: 0.001, p: 1.608}
  ec_number: {family: flat, floor: 0.1}
  ec_class: {family: flat, floor: 0.1}
  catalytic: {family: power, floor: 0.1, tau: 0.001, p: 1.5232}
  choice: {family: single_token, floor: 0.1}
  verdict: null
grammar: {$ref: ../grammar-protein.yaml}
answer: {$ref: ../../answers/gemma-3.yaml}
instruction: Answer Yes or No, then explain.
