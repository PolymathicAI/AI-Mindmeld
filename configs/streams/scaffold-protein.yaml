# The protein property-first reasoning scaffold (data.scaffold.ScaffoldSpec).
# Converted from the original protein runs' property-first reasoning scaffold:
#   rate 0.2: a little less reasoning-prompt help than the original protein runs (they used 0.3);
#   questions: the 24 trained Yes/No keyword questions (original qtypes "yesno") and the location question (qtype
#     "location"); task ids are the original names, as the original domain catalog names them;
#   facts: the original fields in order (field -> field, keywords_choice -> choice, ec_class -> field_class on "ec",
#     keywords_list -> labels, keywords_or_field -> labels_or_field);
#   omit: the original yesno_exclusions.fields per keyword, and the facts whose exclude_qtypes list "location";
#   drop: the original yesno_exclusions.drop per keyword (P(Yes | fact) > 0.9 or < 0.1), and for location the union over
#     qtype_drop_keywords.location; each value in the casing this package shows it ("Process=dNA
#     repair", the original keywords_or_field casing, is "Process=DNA repair"; ScaffoldSpec refuses a value no fact can
#     produce); matched item by item on list values;
#   value_weight 1.0 (the original scaffold weight), floor 0.1 (the original loss-weight floor), fact_max_tokens 40
#     (fact_cap_tokens), max_tokens 160 (the original scaffold cap's default);
#   instructions_heldout are not training text (evaluation only) and are not carried here.
rate: 0.2
questions:
- Membrane
- Cytoplasm
- Secreted
- Mitochondrion
- Nucleus
- Cell membrane
- Plastid
- Transferase
- Oxidoreductase
- Lyase
- Ligase
- Isomerase
- Hydrolase
- Kinase
- DNA-binding
- RNA-binding
- Transport
- Transcription regulation
- Chaperone
- Ribosomal protein
- DNA repair
- Photosynthesis
- Amino-acid biosynthesis
- Protein biosynthesis
- location
instructions:
- 'The slot is an embedding of an unknown protein, produced by another model; it is not a name. Use the embedding itself:
  note a few of its properties (location, membrane or secreted, enzyme class, function type, process), then answer.'
- 'What sits in the slot is a protein embedding from a separate model, not a name or a word. Work from the embedding: note
  a few properties (location, membrane or secreted, enzyme class, function type, process), then answer.'
- Treat the slot as an embedding of an unknown protein made by another model, not as text. First note a few of its properties
  (location, membrane or secreted, enzyme class, function type, process), then answer.
- The slot encodes an unknown protein as an embedding from another model rather than as a word. From that embedding, note
  some of its properties (location, membrane or secreted, enzyme class, function type, process) and then give the answer.
stances:
- I'll infer properties from this protein embedding.
- Inferring properties from the protein embedding.
- Reading properties off the protein embedding.
- I'll work from this protein embedding.
facts:
- key: location
  label: Location
  source: field
  field: subcellular_location
  split: '; '
  lower_first: true
- key: membrane_secreted
  label: Membrane or secreted
  source: choice
  choices:
    Membrane: membrane
    Secreted: secreted
  both: membrane and secreted
- key: enzyme_class
  label: Enzyme class
  source: field_class
  field: ec
  classes:
    '1': oxidoreductase
    '2': transferase
    '3': hydrolase
    '4': lyase
    '5': isomerase
    '6': ligase
    '7': translocase
- key: function_type
  label: Function type
  source: labels
  tasks:
  - DNA-binding
  - RNA-binding
  - Transcription regulation
  - Transport
  - Chaperone
  - Kinase
  - Ribosomal protein
  max_items: 3
- key: process
  label: Process
  source: labels_or_field
  tasks:
  - DNA repair
  - Photosynthesis
  - Amino-acid biosynthesis
  - Protein biosynthesis
  max_items: 2
  field: pathway
  split: '; '
n_facts:
- 1
- 3
value_weight: 1.0
floor: 0.1
fact_max_tokens: 40
max_tokens: 160
itemwise: [labels, labels_or_field]   # drops match list values item by item
omit:
  Membrane:
  - location
  - membrane_secreted
  Cytoplasm:
  - location
  - membrane_secreted
  Secreted:
