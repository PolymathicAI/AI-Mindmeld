# The molecule property-first reasoning scaffold (data.scaffold.ScaffoldSpec): new, not
# the original's (the paper's molecule runs had no scaffold). Rows: the 24 trained ChEBI class Yes/No questions (the
# Yes/No stream's questions, molecule-domain-band-split's task ids); rate 0.2 of the eligible rows, as the proteins'.
# Property lines:
# 1-3, in random order, from trained ChEBI fields only: parent class (`classes`), functional groups
# (`functional_group_classes`) and functional parent (`functional_parent`), each a list field shown item by item (at
# most 2, 3 and 2 items, as ChEBI names them). Never shown: roles, mass, formula, composition or element facts (no fact
# reads them). Excluded per question by the declared give-away rule, measured on the run's training text: a
# value whose balanced posterior P(Yes | value) is above 0.9 or below 0.1 on at least 30 molecules (the original protein
# rule), which covers the asked class's own facts (P(Yes) near 1); the measured drops are recorded with the run.
# Instructions and stances are the protein scaffold's (scaffold-protein.yaml) with "compound" and the molecule
# properties; value_weight, floor and the token caps as the proteins'.
rate: 0.2
questions:
- hydroxides
- heterocyclic compound
- lipid
- organonitrogen heterocyclic compound
- carbohydrates and carbohydrate derivatives
- heteropolycyclic compound
- ester
- monocyclic compound
- ether
- alcohol
- benzenoid aromatic compound
- ketone
- organic polycyclic compound
- amino oligosaccharide
- salt
- organic tricyclic compound
- lactone
- flavonoids
- steroid
- carbopolycyclic compound
- peptide
- organic fundamental parent
- sulfur oxoacid derivative
- chlorobenzenes
instructions:
- 'The slot is an embedding of an unknown compound, produced by another model; it is not a name. Use the embedding itself:
  note a few of its properties (parent class, functional groups, functional parent), then answer.'
- 'What sits in the slot is a compound embedding from a separate model, not a name or a word. Work from the embedding:
  note a few properties (parent class, functional groups, functional parent), then answer.'
- Treat the slot as an embedding of an unknown compound made by another model, not as text. First note a few of its properties
  (parent class, functional groups, functional parent), then answer.
- The slot encodes an unknown compound as an embedding from another model rather than as a word. From that embedding,
  note some of its properties (parent class, functional groups, functional parent) and then give the answer.
stances:
- I'll infer properties from this compound embedding.
- Inferring properties from the compound embedding.
- Reading properties off the compound embedding.
- I'll work from this compound embedding.
facts:
- key: parent_class
  label: Parent class
  source: field_list
  field: classes
  split: '; '
  join: '; '
  max_items: 2
  lower_first: false
- key: functional_groups
  label: Functional groups
  source: field_list
  field: functional_group_classes
  split: '; '
  join: '; '
  max_items: 3
  lower_first: false
- key: functional_parent
  label: Functional parent
  source: field_list
  field: functional_parent
  split: '; '
  join: '; '
  max_items: 2
  lower_first: false
n_facts:
- 1
- 3
value_weight: 1.0
floor: 0.1
fact_max_tokens: 40
max_tokens: 160
itemwise:
- field_list
giveaway:
  high: 0.9
  low: 0.1
  min_support: 30
