# The molecule prompt grammar (data.grammar.GrammarSpec): converted from the paper molecule runs' prompt grammar
# (at rate 0.5, formats min coverage 0.5; no target wording, so the target-wording fields are empty) by the protein
# grammar's rules (grammar-protein.yaml):
# - training entries only (the last entry of every pool and instruction list of two or more is the original's held-out
#   entry and is dropped; seps has none); <SLOT> -> <SLOT:x>;
# - cores for the six trained text tasks of molecule-domain-band-split (the conjugate cores are dropped: the original molecule
#   task split dropped those tasks);
# - formats: per task, every format of its group (text: none, verbatim, one_sentence, two_sentences, bullets; list:
#   none, verbatim) that the original engine allowed the task (its table of allowed formats: bullets
#   only for describe), enabled on the run's training text by the declared coverage rule; disabled: none (the
#   original list was empty);
# - reject: the original molecule runs' held-out templates (a training draw that reproduces one is redrawn).
rate: 0.5
system_roles:
- null
- You are a chemistry assistant. Compounds are given to you as a single embedding token in place of their
  name.
- Each compound in this conversation is represented by one embedding token instead of its name. Treat the
  token as that compound.
- You answer questions about compounds that are given as embeddings rather than names.
- Compound annotation assistant. The compound in each query is given as an embedding token.
- You are an expert in chemistry. The user refers to compounds by embedding tokens, not by name.
- You are a helpful assistant for chemistry. Compounds appear as embedding tokens rather than names.
- Compounds are written here as embedding tokens. Each token stands for one specific compound.
- You are a biochemistry tutor. The student refers to each compound by an embedding token instead of a name.
- Assistant for compound questions. An embedding token takes the place of each compound's name.
- You work with compound embeddings. When the user shows an embedding token, answer about the compound it
  represents.
