- Can you characterize the compound behind this embedding for me?<SLOT:x>
- Our lab isolated a compound, and a model produced the embedding<SLOT:x> for it. Before we plan experiments,
  what can you tell us about this compound and what it does?
- Summarize the biological activity of<SLOT:x> in a sentence or two.
- If you had to explain to a pharmacologist what<SLOT:x> does, what would you say?
