# The protein paper runs' mixture, with the variant stream's clinical upweight (../streams/variant-protein.yaml).
# The shares are variant 20%, relational .2, text .4 and Yes/No .2 over the relational, text and Yes/No streams.
- stream: relational
  share: 0.2
  params: {$ref: ../streams/relational-protein.yaml}
- stream: text
  share: 0.4
  params: {$ref: ../streams/text-protein.yaml}
- stream: yes_no
  share: 0.2
  params: {$ref: ../streams/yes-no-protein.yaml}
- stream: variant
  share: 0.2
  params: {$ref: ../streams/variant-protein.yaml}
