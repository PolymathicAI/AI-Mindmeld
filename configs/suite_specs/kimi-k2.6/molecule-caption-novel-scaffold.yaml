# kimi-k2.6's molecule-caption-novel-scaffold suite on the molecule domain (molecule-domain) and its evaluation item set.
id: molecule-caption-novel-scaffold
kind: caption_nll
domains: [{name: molecule, data: {$pin: molecule-domain}}]
item_set: {$pin: items/molecule-eval-novel-scaffold}
