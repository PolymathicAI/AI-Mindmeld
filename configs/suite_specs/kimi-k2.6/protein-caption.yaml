# kimi-k2.6's protein-caption suite on the protein domain (protein-domain) and its evaluation item set.
id: protein-caption
kind: caption_nll
domains: [{name: protein, data: {$pin: protein-domain}}]
item_set: {$pin: items/protein-eval}
tasks: [caption]
frame: describe
slots: [{name: x, role: object, connector: m}]
conditions: [{object: own}, {object: mismatched}]
thinking: false
capability: score
params: {max_target_tokens: 128, mismatch_seed: 0}
