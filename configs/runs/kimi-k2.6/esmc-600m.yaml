# The paper's Kimi K2.6 x ESM-C 600M run: the protein domain (protein-domain), the protein training set and the
# training-time monitor suite (../../monitor/protein.yaml). Its vectors are extractions of an earlier, larger version
# of these object lists (the sequences are identical; the sets here are subsets of the lists they hold). Kept from the
# run on that earlier version (no refit, no reselection): the connector (read, write layers, starting alphas), the
# step-0 ridge (fitted on that version's fit set and values), the mixture, the optimizer, the checkpoints, the steps,
# the seed and the batch.
destination: connectors/kimi-k2.6/esmc-600m
name: esmc-600m-affine
connector: {$ref: ../../connectors/kimi-k2.6/esmc-600m.yaml}
receiver: {$ref: ../../receivers/kimi-k2.6.yaml}
encoder: {$ref: ../../encoders/esmc-600m.yaml}
domain: {name: protein, data: {$pin: protein-domain}}
# The step-0 ridge (the source-floor target) and the embeddings of the training objects, the monitor items and the
# variants' wild-type parents, pinned under the names below when run.
ridge: {name_described: {$pin: ridges/kimi-k2.6/esmc-600m/ridge}}
embeddings:
  - {$pin: embeddings/esmc-600m/protein-train/embeddings}
  - {$pin: embeddings/esmc-600m/protein-monitor/embeddings}
  - {$pin: embeddings/esmc-600m/protein-parents/embeddings}
# The screened expanded protein training set without the variants of excluded parents and the over-long proteins,
# cited by pin.
training_set: {$pin: protein-training-set/training_set}
mixture: {$ref: ../../training/mixture-protein.yaml}
steps: 2000
# The autotune's choice for all three protein paper runs (preflight chosen_batch 85).
batch: 85
# This case's own micro-batch declaration: null, one `loss` call per step. It is declared here and not in a
# shared file, so a value entered for this case moves no other run.
micro_batch: null
seed: 0
device_class: 8xH200
# W-only weight decay, lambda 2.5e-4 (../../training/optimizer.yaml).
optimizer: {$ref: ../../training/optimizer.yaml}
checkpoints: {$ref: ../../training/checkpoints.yaml}
# The training-time monitor suite (../../monitor/protein.yaml): the original canon caption NLL, own and mismatched.
# Evaluations and committed checkpoints every 200 steps.
# The monitor: 300 validation proteins (held by the monitor extraction) plus 200 training-set members (held by the
# training extraction); the train-vs-val gap is read per monitor record.
eval_suite: {$ref: ../../monitor/protein.yaml}
eval_every: 200
# Activation checkpointing OFF, handed to the backend by the trainer.
checkpointing: false
