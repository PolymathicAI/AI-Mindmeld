# The Gemma 3 12B x ESM-C 6B multi-token MLP run trained on all tasks: the connector of
# ../kimi-k2.6/esmc-6b-mlp4-staggered-all-tasks.yaml with every token at esmc-6b.yaml's write layers [6, 11, 16, 23, 33,
# 44], on the all-tasks training set and mixture, for 5,000 steps. Micro-batch 4 needs a GPU of 94 GB or more.
destination: connectors/gemma-3-12b-it/esmc-6b-mlp4-all-tasks
name: esmc-6b-mlp4-all-tasks
connector:
  name: esmc-6b-mlp4
  receiver: gemma-3-12b-it
  input: {recipe: esmc-6b-l51l80, layers: {$ref: ../../shared/read-esmc-6b.yaml}, combine: concat}
  tokens:
    - {target: name_described, noise: 0.03}
    - {target: name_described, noise: 0.03}
    - {target: name_described, noise: 0.03}
    - {target: name_described, noise: 0.03}
  layer0: constant
  layers:
    rule: explicit
    per_token:
      - [6, 11, 16, 23, 33, 44]
      - [6, 11, 16, 23, 33, 44]
      - [6, 11, 16, 23, 33, 44]
      - [6, 11, 16, 23, 33, 44]
  kind: mlp
  kind_params: {d_s: 2560, ff_mult: 4}
  alpha:
    first: null
    init: 0.5
    learned: true
    budget: null
    per_layer: {6: 0.704073, 11: 0.9, 16: 0.634983, 23: 0.339792, 33: 0.199957, 44: 0.1}  # every token
  seed: 0
  layer_choice: {decisions: [], note: "every token at the ordinary gemma-3-12b-it ESM-C 6B connector's write layers,
      from its starting alphas; four tokens, not staggered"}
receiver: {$ref: ../../receivers/gemma-3-12b-it.yaml}
encoder: {$ref: ../../encoders/esmc-6b-l51l80.yaml}
domain: {name: protein, data: {$pin: protein-domain}}
ridge: {name_described: {$pin: ridges/gemma-3-12b-it/esmc-6b}}
embeddings:
  - {$pin: embeddings/esmc-6b/protein-train}
  - {$pin: embeddings/esmc-6b/protein-monitor}
  - {$pin: embeddings/esmc-6b/protein-parents}
training_set: {$pin: protein-training-set-all-tasks/training_set}
mixture: {$ref: ../../training/gemma-3-12b-it/mixture-protein-all-tasks.yaml}
steps: 5000
batch: 85
micro_batch: 4
seed: 0
device_class: A100
optimizer:
  lr_rel: 0.002
  lr_alpha: 0.01
  warmup_steps: 20
  schedule: constant
  weight_decay: 0.0001
  clip: 1.0
checkpoints: {$ref: ../../training/checkpoints.yaml}
eval_suite: {$ref: ../../monitor/protein.yaml}
eval_every: 200
