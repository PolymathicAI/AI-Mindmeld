# gemma-3-4b-it's version of runs/kimi-k2.6/mimic.yaml.
destination: connectors/gemma-3-4b-it/mimic
name: mimic-affine
connector: {$ref: ../../connectors/gemma-3-4b-it/mimic.yaml}
receiver: {$ref: ../../receivers/gemma-3-4b-it.yaml}
encoder: {$ref: ../../encoders/mimic-mean.yaml}
domain:
  name: protein
  data: {$pin: protein-domain}
ridge:
  name_described: {$pin: ridges/gemma-3-4b-it/mimic/ridge}
embeddings:
- {$pin: embeddings/mimic/protein-train/embeddings}
- {$pin: embeddings/mimic/protein-monitor/embeddings}
- {$pin: embeddings/mimic/protein-parents/embeddings}
training_set: {$pin: protein-training-set/training_set}
