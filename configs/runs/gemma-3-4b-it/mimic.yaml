steps: 2000
batch: 85
micro_batch: 16
seed: 0
device_class: A100
optimizer: {$ref: ../../training/optimizer.yaml}
checkpoints: {$ref: ../../training/checkpoints.yaml}
eval_suite: {$ref: ../../monitor/protein.yaml}
eval_every: 200
