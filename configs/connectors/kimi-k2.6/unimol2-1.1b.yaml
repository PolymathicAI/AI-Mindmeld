# The paper's Uni-Mol2 1.1B connector (2,000 steps; the architecture stays the paper connector's: one
# token, a layer-0 constant, an affine map). Read: Uni-Mol2 1.1B layer [23], CLS + atom mean
# (configs/shared/read-unimol2-1.1b.yaml), taken from the all-layer extraction's recipe unimol2-1.1b (as
# MIMIC reads its all-layer recipe): the training vectors are the layer-selection study's artifact. Write: layers
# 7, 13, 22, 32, 49, 57 plus the layer-0 constant, object-independent: one shared layer set for Kimi K2.6's molecule
# connectors. Alpha: every write-layer alpha, the first
# included, learned, no budget; the layer-0 constant stays at alpha 1; each starts at its per_layer value below,
# in place of the default 0.5. The one token's init target is the description-primed name state. Its recipe computes
# each molecule as if alone and never crops.
name: unimol2-1.1b-affine
receiver: kimi-k2.6
input: {recipe: unimol2-1.1b, layers: {$ref: ../../shared/read-unimol2-1.1b.yaml}, combine: concat}
tokens:
  - {target: name_described}
layer0: constant
layers:
  rule: explicit
  per_token:
    - [7, 13, 22, 32, 49, 57]
kind: affine
# Starting alphas: the clipped AUROC-weighted candidate H_auroc_weighted_clipped (AUROC-weighted, clipped to
# [0.1, 0.9]), the rule of every connector, Kimi's included; exploratory, selected on the same items it was
# scored on; scored in the scan record 61892581.
alpha: {first: null, init: 0.5, learned: true, budget: null, per_layer: {7: 0.830927, 13: 0.9, 22: 0.327018, 32: 0.1, 49: 0.1, 57: 0.1}}
seed: 0
layer_choice:
  decisions: []
  note: "the paper's architecture; the chosen read; the shared Kimi molecule write layers 7/13/22/32/49/57, chosen
    from the 19-connector ridge-write comparison (see examples/guides/choosing_layers.md); layer 0 writes only the
    object-independent constant"
