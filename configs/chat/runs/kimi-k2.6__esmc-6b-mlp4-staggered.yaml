# The released Kimi K2.6 x ESM-C 6B four-token mlp connector (bundle kimi-k2.6__esmc-6b-mlp4-staggered) for chat:
# the run ../../runs/kimi-k2.6/esmc-6b-mlp4-staggered.yaml with every field as there but `destination`, which is
# its achieved publication's (../../runs/kimi-k2.6/esmc-6b-mlp4-staggered-achieved.yaml), so chat finds the released
# checkpoint pin connectors/kimi-k2.6/esmc-6b-mlp4-staggered/step_002000. Generated from that run (its $ref paths
# rebased here); keep the two equal (tests/unit/test_chat_cli.py checks it).
destination: connectors/kimi-k2.6/esmc-6b-mlp4-staggered
name: esmc-6b-mlp4-staggered
connector:
  name: esmc-6b-mlp4-staggered
  receiver: kimi-k2.6
  input:
    recipe: esmc-6b-l51l80
    layers:
      $ref: ../../shared/read-esmc-6b.yaml
    combine: concat
  tokens:
  - target: name_described
    noise: 0.03
  - target: name_described
    noise: 0.03
  - target: name_described
    noise: 0.03
  - target: name_described
    noise: 0.03
  layer0: constant
  layers:
    rule: explicit
    per_token:
    - - 5
      - 9
      - 14
      - 22
      - 36
      - 49
    - - 6
      - 10
      - 15
      - 25
      - 39
      - 54
    - - 7
      - 11
      - 16
      - 31
      - 42
      - 56
    - - 8
      - 13
      - 21
      - 33
      - 46
      - 58
  kind: mlp
  kind_params:
    d_s: 2560
    ff_mult: 4
  alpha:
    first: null
    init: 0.4
    learned: true
    budget: null
    per_layer:
      5: 0.741244
      9: 0.9
      14: 0.700814
      22: 0.405965
      36: 0.1
      49: 0.115146
      6: 0.9
      10: 0.9
      15: 0.856186
      25: 0.385338
      39: 0.1
      54: 0.1
      7: 0.9
      11: 0.710971
      16: 0.559944
      31: 0.215801
      42: 0.1
      56: 0.132373
      8: 0.9
      13: 0.839005
      21: 0.350827
      33: 0.223709
      46: 0.1
      58: 0.112888
  seed: 0
  layer_choice:
    decisions: []
    note: the staggered layout, six writes a token in turn; read [51|80]
receiver:
  $ref: ../../receivers/kimi-k2.6.yaml
encoder:
  $ref: ../../encoders/esmc-6b-l51l80.yaml
domain:
  name: protein
  data:
    $pin: protein-domain
ridge:
  name_described:
    $pin: ridges/kimi-k2.6/esmc-6b
embeddings:
- $pin: embeddings/esmc-6b/protein-train
- $pin: embeddings/esmc-6b/protein-monitor
- $pin: embeddings/esmc-6b/protein-parents
training_set:
  $pin: protein-training-set/training_set
mixture:
  $ref: ../../training/mixture-protein.yaml
steps: 5000
batch: 85
micro_batch:
  $ref: ../../training/micro-batch.yaml
seed: 0
device_class: 8xH200
optimizer:
  lr_rel: 0.002
  lr_alpha: 0.01
  warmup_steps: 20
  schedule: constant
  weight_decay: 0.0001
  clip: 1.0
checkpoints:
  $ref: ../../training/checkpoints.yaml
eval_suite:
  $ref: ../../monitor/protein.yaml
eval_every: 200
checkpointing: false
