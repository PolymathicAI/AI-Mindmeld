# The chat deployment config (latent_interconnect.chat.config.ChatConfig). A server serves one
# receiver of it (`--receiver`); another is a restart (load costs: expected_load_s below). The
# connectors are a fixed manifest: the 18 step-2000 paper connectors of the three
# receivers and Gemma 3 4B x ESM-C 6B. Each cites its run
# config; the checkpoint is the run's <destination>/step_002000 pin, its receiver checked against the receiver here.
inputs:
  protein: {id: uniprot, value: sequence, max_chars: 4000}
  molecule: {id: chebi, value: smiles, max_chars: 1000}
defaults: {thinking: false, temperature: 0.6, max_tokens: 2048, system: ""}
max_tokens_cap: 16384
receivers:
  kimi-k2.6:
    label: Kimi K2.6
    receiver: {$ref: ../receivers/kimi-k2.6.yaml}
    # one request at a time (KimiVLLM.stream); the engine's KV check holds this plan at max_model_len
    generation_plan: {max_num_seqs: 1, max_num_batched_tokens: 16384}
    context: 16384  # the launcher passes max_model_len=16384 to kimi-vllm (its default 4,096); the server checks it
    expected_load_s: 830  # an estimate: a separate vLLM deployment's measured engine start-up
    connectors:
      esmc-600m: {label: ESM-C 600M, run: {$ref: ../runs/kimi-k2.6/esmc-600m.yaml}, step: 2000}
      mimic: {label: MIMIC, run: {$ref: ../runs/kimi-k2.6/mimic.yaml}, step: 2000}
      pglm-1b: {label: PGLM-1B, run: {$ref: ../runs/kimi-k2.6/pglm-1b.yaml}, step: 2000}
      chemfm-1b: {label: ChemFM-1B, run: {$ref: ../runs/kimi-k2.6/chemfm-1b.yaml}, step: 2000, operational_only: true}
      molformer-c3: {label: MoLFormer-c3, run: {$ref: ../runs/kimi-k2.6/molformer-c3.yaml}, step: 2000, operational_only: true}
      unimol2-1.1b: {label: Uni-Mol2 1.1B, run: {$ref: ../runs/kimi-k2.6/unimol2-1.1b.yaml}, step: 2000, operational_only: true}
  gemma-3-4b-it:
    label: Gemma 3 4B
    receiver: {$ref: ../receivers/gemma-3-4b-it.yaml}
    context: 8192
    # measured cold start to ready on a GPU workstation (connectors 59.8 s, model 101.6 s)
    expected_load_s: 168
    connectors:
      esmc-600m: {label: ESM-C 600M, run: {$ref: ../runs/gemma-3-4b-it/esmc-600m.yaml}, step: 2000}
      mimic: {label: MIMIC, run: {$ref: ../runs/gemma-3-4b-it/mimic.yaml}, step: 2000}
      pglm-1b: {label: PGLM-1B, run: {$ref: ../runs/gemma-3-4b-it/pglm-1b.yaml}, step: 2000}
      chemfm-1b: {label: ChemFM-1B, run: {$ref: ../runs/gemma-3-4b-it/chemfm-1b.yaml}, step: 2000}
      molformer-c3: {label: MoLFormer-c3, run: {$ref: ../runs/gemma-3-4b-it/molformer-c3.yaml}, step: 2000}
      unimol2-1.1b: {label: Uni-Mol2 1.1B, run: {$ref: ../runs/gemma-3-4b-it/unimol2-1.1b.yaml}, step: 2000}
      esmc-6b: {label: ESM-C 6B, run: {$ref: ../runs/gemma-3-4b-it/esmc-6b.yaml}, step: 2000}
  gemma-3-12b-it:
    label: Gemma 3 12B
    receiver: {$ref: ../receivers/gemma-3-12b-it.yaml}
    context: 8192
    # measured cold start to ready on a GPU workstation (connectors 43.4 s, model 251.7 s)
    expected_load_s: 302
    connectors:
      esmc-600m: {label: ESM-C 600M, run: {$ref: ../runs/gemma-3-12b-it/esmc-600m.yaml}, step: 2000}
      mimic: {label: MIMIC, run: {$ref: ../runs/gemma-3-12b-it/mimic.yaml}, step: 2000}
      pglm-1b: {label: PGLM-1B, run: {$ref: ../runs/gemma-3-12b-it/pglm-1b.yaml}, step: 2000}
      chemfm-1b: {label: ChemFM-1B, run: {$ref: ../runs/gemma-3-12b-it/chemfm-1b.yaml}, step: 2000}
      molformer-c3: {label: MoLFormer-c3, run: {$ref: ../runs/gemma-3-12b-it/molformer-c3.yaml}, step: 2000}
      unimol2-1.1b: {label: Uni-Mol2 1.1B, run: {$ref: ../runs/gemma-3-12b-it/unimol2-1.1b.yaml}, step: 2000}
